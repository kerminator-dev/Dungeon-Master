<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labyrinth</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,serif;color:#e8d8b8}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;inset:0;display:flex;background:rgba(0,0,0,.78);text-align:center;overflow:auto}
.panel{max-width:620px;width:92%;padding:18px 24px;margin:auto}
.hidden{display:none!important}
#ui h1{font-size:52px;margin:0 0 10px;letter-spacing:6px;text-shadow:0 0 18px #c0602a}
#ui h2{margin:0 0 10px;letter-spacing:3px}
#ui p{margin:4px;font-size:15px;opacity:.85}
.btn{display:block;width:260px;margin:10px auto;padding:10px 0;font:inherit;font-size:21px;letter-spacing:3px;color:#f3e2c0;background:#5a2a16;border:2px solid #b8803c;cursor:pointer}
.btn:hover{background:#7a3a1c}.btn.alt{background:#2a2420;border-color:#6a5a48}
.set{display:grid;grid-template-columns:190px 1fr 56px;gap:8px 10px;align-items:center;text-align:left;margin:14px 0;padding:12px 14px;background:#0008;border:1px solid #5a4028;font-size:15px}
.set input[type=range],.set select{width:100%}
.set .chk{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.set b{text-align:right;font-weight:normal;color:#ffcc66}
#maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0}
.card{padding:10px 8px;border:2px solid #4a3a2c;background:#0009;cursor:pointer;font-size:14px;text-align:center}
.card:hover{border-color:#b8803c}.card.sel{border-color:#ffcc66;background:#2a1a10}
.card i{display:block;height:34px;margin-bottom:6px;border:1px solid #000}
.card b{display:block;font-size:16px;margin-bottom:3px;color:#ffe0a8}
.card span{opacity:.8;font-size:12px}
#hud{position:fixed;left:14px;top:12px;font-size:16px;text-shadow:1px 1px 0 #000;pointer-events:none;line-height:1.4}
#fps{color:#9f9}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-size:28px;letter-spacing:3px;text-shadow:0 0 12px #000,2px 2px 0 #000;pointer-events:none;opacity:0;transition:opacity .4s}
#map{position:fixed;right:12px;top:12px;image-rendering:pixelated;border:2px solid #5a4028;display:none;background:#000a}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff8;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><canvas id="map" width="64" height="64"></canvas><div id="cross"></div>
<div id="hud"><div id="loc"></div><div id="fps"></div></div><div id="toast"></div>
<div id="ui">
 <div id="scr-main" class="panel"><h1>LABYRINTH</h1>
  <button class="btn hidden" id="btnResume">ПРОДОЛЖИТЬ</button>
  <button class="btn" id="btnPlay">ИГРАТЬ</button>
  <button class="btn alt" id="btnSet">НАСТРОЙКИ</button>
  <p>WASD — ходьба · Shift — бег · мышь — обзор · M — карта · R — новый лабиринт · Esc — меню</p>
 </div>
 <div id="scr-play" class="panel hidden"><h2>ВЫБОР КАРТЫ</h2>
  <div id="maps"></div>
  <div class="set"><label for="size">Размер лабиринта</label><input id="size" type="range" min="5" max="30" step="1"><b id="sizeV"></b></div>
  <p>Лабиринт каждый раз генерируется случайно. Найди выход — и попадёшь в новый.</p>
  <button class="btn" id="btnStart">НАЧАТЬ</button>
  <button class="btn alt" data-back>НАЗАД</button>
 </div>
 <div id="scr-set" class="panel hidden"><h2>НАСТРОЙКИ</h2>
  <div class="set">
   <label for="sens">Чувствительность мыши</label><input id="sens" type="range" min="0.2" max="3" step="0.05"><b id="sensV"></b>
   <label for="fov">Поле зрения (FOV)</label><input id="fov" type="range" min="60" max="100" step="1"><b id="fovV"></b>
   <label for="pix">Размер пикселя</label><input id="pix" type="range" min="1" max="6" step="1"><b id="pixV"></b>
   <label for="cap">Лимит FPS</label><select id="cap"><option value="0">Без лимита (частота монитора)</option><option value="30">30</option><option value="45">45</option><option value="60">60</option><option value="90">90</option><option value="120">120</option><option value="144">144</option></select><b></b>
   <div class="chk" id="hzInfo" style="opacity:.8;font-size:13px">Частота обновления браузера: измеряется…</div>
   <label class="chk"><input id="showfps" type="checkbox"> Показывать FPS</label>
   <label class="chk"><input id="bob" type="checkbox"> Покачивание камеры при ходьбе</label>
   <label class="chk"><input id="invert" type="checkbox"> Инвертировать вертикаль мыши</label>
  </div>
  <button class="btn alt" data-back>НАЗАД</button>
 </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// ---------- Настройки (сохраняются в браузере) ----------
const S = {sens:1, fov:70, pix:3, fps:true, bob:true, invert:false, cap:0, map:'dungeon', size:12};
try{Object.assign(S,JSON.parse(localStorage.getItem('lab_settings')||'{}'))}catch(e){}
function saveS(){try{localStorage.setItem('lab_settings',JSON.stringify(S))}catch(e){}}
const B = 2;                   // размер блока
let level = 0, N = 8;          // клеток по стороне
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(S.fov, 1, 0.2, 80);
camera.rotation.order = 'YXZ';
scene.add(camera);
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(Math.ceil(w/S.pix), Math.ceil(h/S.pix), false);
  camera.aspect=w/h; camera.fov=S.fov; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- RNG ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd = Math.random;

// ---------- Процедурные пиксельные текстуры ----------
function tex(w,h,fn,rx=1,ry=1){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');fn(g,w,h);
  const t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestMipmapNearestFilter;t.anisotropy=1;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);
  return t;
}
const R=(a,b)=>a+Math.random()*(b-a);
function shade(hex,k){const c=new THREE.Color(hex);c.r=Math.min(1,c.r*k);c.g=Math.min(1,c.g*k);c.b=Math.min(1,c.b*k);return '#'+c.getHexString()}
function bricks(g,w,h,base,mortar,moss,rowH=4,brickW=8){
  g.fillStyle=mortar;g.fillRect(0,0,w,h);
  let row=0;
  for(let y=0;y<h;y+=rowH,row++){
    const off=row%2?brickW/2:0;
    for(let x=-off;x<w;x+=brickW){
      g.fillStyle=shade(base,R(.78,1.18));
      g.fillRect(x+1,y+1,brickW-1,rowH-1);
      g.fillStyle=shade(base,1.3);g.fillRect(x+1,y+1,brickW-1,1); // блик сверху
    }
  }
  for(let i=0;i<w*h*.05;i++){g.fillStyle=shade(base,R(.6,1.3));g.fillRect(Math.random()*w|0,Math.random()*h|0,1,1)}
  if(moss)for(let i=0;i<w*h*.02;i++){g.fillStyle=moss;g.fillRect(Math.random()*w|0,Math.random()*h|0,1,R(1,3)|0)}
}
function cracks(g,w,h,n,col){g.fillStyle=col;for(let i=0;i<n;i++){let x=Math.random()*w|0,y=Math.random()*h|0;for(let k=0;k<R(4,10);k++){g.fillRect(x,y,1,1);x+=Math.random()<.5?0:(Math.random()<.5?-1:1);y+=1;}}}
function slabs(g,w,h,base,mortar,n){ // плиты пола n×n
  g.fillStyle=mortar;g.fillRect(0,0,w,h);const s=w/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){g.fillStyle=shade(base,R(.8,1.15));g.fillRect(i*s+1,j*s+1,s-1,s-1);
    for(let k=0;k<s*s*.12;k++){g.fillStyle=shade(base,R(.7,1.25));g.fillRect(i*s+1+Math.random()*(s-2)|0,j*s+1+Math.random()*(s-2)|0,1,1)}}
}
function px(g,c,x,y,w=1,h=1){g.fillStyle=c;g.fillRect(x,y,w,h)}
const T = {
  brick: tex(16,24,(g,w,h)=>bricks(g,w,h,'#7c5646','#2a1712','#4f6a2a')),
  brickCrack: tex(16,24,(g,w,h)=>{bricks(g,w,h,'#785444','#2a1712','#4f6a2a');cracks(g,w,h,4,'#1a0d09')}),
  brickMoss: tex(16,24,(g,w,h)=>{bricks(g,w,h,'#72503f','#241410','#3f6a22');
      for(let i=0;i<60;i++){px(g,shade('#4a7a28',R(.6,1.2)),Math.random()*w|0,h-1-(Math.random()*Math.random()*12|0),1,R(1,3)|0)}}),
  brickSnow: tex(16,24,(g,w,h)=>{bricks(g,w,h,'#7c5646','#33211c','#4f6a2a');
      g.fillStyle='#dfe8f2';for(let x=0;x<w;x++){if(Math.random()<.7)g.fillRect(x,0,1,R(1,4)|0)}}),
  brickSnow2: tex(16,24,(g,w,h)=>{bricks(g,w,h,'#6e4c40','#33211c','#4f6a2a');cracks(g,w,h,3,'#1f1210');
      g.fillStyle='#e6eef7';for(let x=0;x<w;x++){if(Math.random()<.6)g.fillRect(x,0,1,R(1,3)|0)}
      for(let i=0;i<20;i++)px(g,'#dfe8f2',Math.random()*w|0,Math.random()*h|0,2,1)}),
  snowTop: tex(8,8,(g,w,h)=>{g.fillStyle='#e6eef7';g.fillRect(0,0,w,h);for(let i=0;i<20;i++){g.fillStyle=shade('#e6eef7',R(.85,1));g.fillRect(Math.random()*w|0,Math.random()*h|0,1,1)}}),
  flag: tex(32,32,(g,w,h)=>{slabs(g,w,h,'#5a5048','#1e1815',2);cracks(g,w,h,5,'#1a1512');
      for(let i=0;i<8;i++)px(g,'#3f5a22',Math.random()*w|0,Math.random()*h|0,2,1)}),
  path: tex(16,16,(g,w,h)=>slabs(g,w,h,'#6a666c','#2d2b30',2)),
  ceil: tex(16,16,(g,w,h)=>bricks(g,w,h,'#5a3a2c','#1c110c',null,4,8)),
  snow: tex(32,32,(g,w,h)=>{g.fillStyle='#dbe6f2';g.fillRect(0,0,w,h);for(let i=0;i<160;i++){g.fillStyle=shade('#dbe6f2',R(.8,1.03));g.fillRect(Math.random()*w|0,Math.random()*h|0,R(1,3)|0,1)}}),
  wood: tex(8,8,(g,w,h)=>{for(let x=0;x<w;x++){g.fillStyle=shade('#6b4423',R(.8,1.15));g.fillRect(x,0,1,h)}g.fillStyle='#2a1a0c';g.fillRect(0,3,w,1);}),
  chest: tex(16,16,(g,w,h)=>{for(let y=0;y<h;y++){g.fillStyle=shade('#6e4a2a',R(.85,1.1));g.fillRect(0,y,w,1)}
      g.fillStyle='#3b3633';g.fillRect(0,0,w,2);g.fillRect(0,h-2,w,2);g.fillRect(3,0,2,h);g.fillRect(11,0,2,h);g.fillStyle='#c9a030';g.fillRect(7,6,2,3)}),
  pine: tex(8,8,(g,w,h)=>{g.fillStyle='#1d3b30';g.fillRect(0,0,w,h);for(let i=0;i<30;i++){g.fillStyle=Math.random()<.45?'#eef4fa':shade('#2b5642',R(.7,1.2));g.fillRect(Math.random()*w|0,Math.random()*h|0,2,1)}}),
  rock: tex(8,8,(g,w,h)=>{g.fillStyle='#6e6a70';g.fillRect(0,0,w,h);for(let i=0;i<24;i++){g.fillStyle=shade('#6e6a70',R(.7,1.2));g.fillRect(Math.random()*w|0,Math.random()*h|0,2,2)}}),
  snowRock: tex(8,8,(g,w,h)=>{g.fillStyle='#6e6a70';g.fillRect(0,0,w,h);for(let i=0;i<20;i++){g.fillStyle=shade('#6e6a70',R(.7,1.2));g.fillRect(Math.random()*w|0,Math.random()*h|0,2,2)}
      for(let i=0;i<40;i++)px(g,'#eef4fa',Math.random()*w|0,Math.random()*h*.6|0,2,1)}),
  flame: tex(8,12,(g,w,h)=>{const p=(x,y,c)=>{g.fillStyle=c;g.fillRect(x,y,1,1)};
      for(let y=0;y<h;y++){const wd=Math.max(1,Math.round(Math.sin(y/h*Math.PI)*3.5*(y/h<.3?.6:1)));
        for(let x=0;x<w;x++){const d=Math.abs(x-3.5);if(d<wd/1.1)p(x,h-1-y,y<h*.3?'#fff2b0':y<h*.6?'#ffb030':'#ff5a10')}}}),
  // ---- декали (с прозрачностью) ----
  banner: tex(16,32,(g,w,h)=>{
      for(let y=0;y<h;y++){const cut=y>h-6?Math.abs(((w/2)-Math.abs(((Math.floor(w/2))-(0))))):0;
        for(let x=0;x<w;x++){const tail=y>h-6&&((x%8)<(y-(h-6)));if(tail)continue;
          px(g,shade('#8c1616',(x%4<2?1:.88)*R(.92,1.05)),x,y)}}
      px(g,'#d8b040',0,0,w,2);px(g,'#d8b040',7,9,2,10);px(g,'#d8b040',4,12,8,2);px(g,'#d8b040',6,19,4,2)}),
  window: tex(16,22,(g,w,h)=>{
      const inArch=(x,y)=>y>=7?(x>=3&&x<=12):((x-7.5)**2+(y-7)**2<=4.5**2);
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(y<2&&(x<2||x>13))continue;px(g,shade('#7a4a38',R(.8,1.15)),x,y)}
      for(let y=2;y<h-2;y++)for(let x=2;x<14;x++)if(inArch(x,y)&&y>=2)px(g,'#0b0f1a',x,y);
      for(const bx of [5,8,11])px(g,'#8a8a92',bx,4,1,h-8);px(g,'#8a8a92',3,12,10,1);
      for(let y=2;y<h-2;y++)px(g,'#a07a50',2,y,1,1)}),
  door: tex(24,40,(g,w,h)=>{
      const inD=(x,y)=>y>=10?(x>=3&&x<=20):((x-11.5)**2+(y-10)**2<=8.5**2);
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){ if(inD(x,y)||Math.abs(x-11.5)<9&&y>=1&&y<10&&false)px(g,shade('#6b4423',R(.8,1.15)+(x%4==0?-.15:0)),x,y);
        else if(y>=1&&((x>=1&&x<=22)&&(y>=1)&&(inD(x+1,y)||inD(x-1,y)||inD(x,y+1)||inD(x,y-1)||inD(x+2,y)||inD(x-2,y))))px(g,'#8a8a92',x,y)}
      for(const by of [14,24,34])px(g,'#6e6e76',3,by,18,2);
      px(g,'#b8a030',10,21,4,5);px(g,'#222',11,22,2,2)}),
  cobweb: tex(16,16,(g,w,h)=>{g.fillStyle='rgba(220,220,230,.85)';
      for(let i=0;i<16;i++){g.fillRect(i,0,1,1);g.fillRect(0,i,1,1);g.fillRect(i,i,1,1)}
      for(const r of [5,9,13])for(let a=0;a<=r;a++){g.fillRect(Math.round(r*Math.sin(a/r*1.57)),Math.round(r*Math.cos(a/r*1.57)),1,1)}}),
  decal: tex(16,24,(g,w,h)=>{cracks(g,w,h,3,'#150a07');for(let i=0;i<14;i++)px(g,shade('#4a7a28',R(.6,1.2)),Math.random()*w|0,Math.random()*h|0,R(1,3)|0,R(1,4)|0)}),
  icicle: tex(16,6,(g,w,h)=>{let x=0;while(x<w){const len=R(2,6)|0,wd=R(1,3)|0;for(let k=0;k<len;k++)px(g,k<len*.4?'#eaf4ff':'#b8d4ee',x+(wd>1&&k>len*.6?1:0),k,wd>1&&k>len*.6?wd-1:wd,1);x+=wd+(R(0,2)|0)}
      px(g,'#e6eef7',0,0,w,1)}),
  slime: tex(8,8,(g,w,h)=>{g.fillStyle='#3c7a1c';g.fillRect(0,0,w,h);for(let i=0;i<24;i++){g.fillStyle=shade('#4f9a28',R(.6,1.3));g.fillRect(Math.random()*w|0,Math.random()*h|0,2,1)}}),
  skull: tex(8,8,(g,w,h)=>{g.fillStyle='#d8cfb4';g.fillRect(1,0,6,5);g.fillRect(2,5,4,2);g.fillStyle='#1a1410';g.fillRect(2,2,1,2);g.fillRect(5,2,1,2);g.fillRect(3,5,1,1);g.fillRect(4,5,1,1)}),
};
for(const k of ['flame','banner','window','door','cobweb','decal','icicle','skull'])T[k].wrapS=T[k].wrapT=THREE.ClampToEdgeWrapping;

// ---- дополнительные текстуры ----
function noiseTex(w,h,base,n,lo=.7,hi=1.25,rx=1,ry=1){return tex(w,h,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++)px(g,shade(base,R(lo,hi)),Math.random()*w|0,Math.random()*h|0,R(1,3)|0,1)},rx,ry)}
function rockTex(base,hl){return tex(16,24,(g,w,h)=>{g.fillStyle=shade(base,.75);g.fillRect(0,0,w,h);
  for(let i=0;i<14;i++){const x=Math.random()*w|0,y=Math.random()*h|0,ww=R(4,9)|0,hh=R(3,7)|0;px(g,shade(base,R(.8,1.2)),x,y,ww,hh);px(g,shade(base,1.25),x,y,ww,1)}
  for(let i=0;i<70;i++)px(g,shade(base,R(.6,1.3)),Math.random()*w|0,Math.random()*h|0,1,1);cracks(g,w,h,3,shade(base,.3));
  if(hl)for(let i=0;i<30;i++)px(g,hl,Math.random()*w|0,Math.random()*h*.7|0,2,1)})}
T.rockwall=rockTex('#6a5c50');T.rockwallSnow=rockTex('#665e58','#eef4fa');T.cavewall=rockTex('#50504c');T.cavewall2=rockTex('#46484a');
T.nord=tex(16,24,(g,w,h)=>{bricks(g,w,h,'#625f58','#1c1a17','#3f5a3a',6,12);px(g,'#6a5a30',0,11,w,1)});
T.nord2=tex(16,24,(g,w,h)=>{bricks(g,w,h,'#5a5852','#1c1a17','#3f5a3a',6,12);cracks(g,w,h,4,'#171512');px(g,'#6a5a30',0,11,w,1)});
T.catbrick=tex(16,24,(g,w,h)=>{bricks(g,w,h,'#7a7468','#1f1c18','#3a5a2a',4,8);cracks(g,w,h,3,'#14110e')});
T.skullwall=tex(16,24,(g,w,h)=>{bricks(g,w,h,'#726c60','#1f1c18',null,4,8);
  for(let k=0;k<6;k++){const x=(Math.random()*12|0)+1,y=(Math.random()*5|0)*4+1;px(g,'#d8cfb4',x,y,3,2);px(g,'#1a1410',x,y+1,1,1);px(g,'#1a1410',x+2,y+1,1,1)}});
T.icewall=tex(16,24,(g,w,h)=>{g.fillStyle='#4f7aa8';g.fillRect(0,0,w,h);
  for(let i=0;i<60;i++)px(g,shade('#6fa0cc',R(.7,1.3)),Math.random()*w|0,Math.random()*h|0,R(1,4)|0,R(1,5)|0);
  for(let i=0;i<10;i++)px(g,'#d8ecff',Math.random()*w|0,Math.random()*h|0,1,R(2,6)|0)});
T.icewall2=tex(16,24,(g,w,h)=>{g.fillStyle='#3f6a98';g.fillRect(0,0,w,h);
  for(let i=0;i<50;i++)px(g,shade('#5f90bc',R(.7,1.3)),Math.random()*w|0,Math.random()*h|0,R(1,5)|0,R(1,4)|0);cracks(g,w,h,5,'#c8e4ff')});

function mergeStatic(){

  for(const m of meshes){

        case 'icecave':P.push([.2,()=>crystal(rnd()<.8?M.crystalI:M.crystalP),'w'],[.15,stalagmite,'w'],[.08,()=>iceBlock(rnd()<.6),'w'],[.12,icePatch,'f'],[.03,()=>chest(false),'w'],[.05,()=>skeleton(false),'w']);break;
        case 'nordic':P.push([.12,brazier,'w'],[.12,urn,'w'],[.1,()=>chest(rnd()<.3),'w'],[.12,()=>draugr(rnd()<.5),'w'],[.08,coffin,'w'],[.06,barrel,'w'],[.06,weaponRack,'w'],[.06,candles,'w'],[.06,rubble,'f']);break;
        case 'castle':P.push([.14,armor,'w'],[.1,bookshelf,'w'],[.08,()=>chest(rnd()<.3),'w'],[.06,barrel,'w'],[.12,candelabra,'w'],[.1,statue,'w'],[.08,weaponRack,'w'],[.08,urn,'w'],[.04,()=>crate(false),'w']);break;
        case 'forest':P.push([.06,()=>chest(false),'w'],[.06,()=>crate(false),'w'],[.06,barrel,'w'],[.1,fence,'w'],[.06,woodpile,'w'],[.06,lampPost,'w'],[.08,signpost,'w'],[.05,()=>skeleton(rnd()<.5),'w'],[.1,rubble,'f'],[.12,log,'w'],[.15,bush,'w'],[.06,statue,'w']);break;
        case 'desert':P.push([.06,()=>chest(false),'w'],[.08,()=>crate(false),'w'],[.06,barrel,'w'],[.12,urn,'w'],[.16,cactus,'w'],[.05,()=>skeleton(rnd()<.5),'w'],[.08,sacks,'w'],[.05,statue,'w'],[.12,rubble,'f'],[.05,lampPost,'w'],[.05,signpost,'w']);break;
        case 'swamp':P.push([.1,log,'w'],[.2,reeds,'w'],[.06,skullPole,'w'],[.05,barrel,'w'],[.05,()=>crate(false),'w'],[.08,()=>skeleton(rnd()<.5),'w'],[.08,bonePile,'f'],[.1,mushrooms,'w'],[.06,lampPost,'w'],[.1,rubble,'f'],[.1,puddle,'f']);break;
        case 'sewer':P.push([.12,barrel,'w'],[.08,()=>crate(false),'w'],[.08,()=>skeleton(rnd()<.5),'w'],[.08,bonePile,'f'],[.1,slimePit,'f'],[.1,puddle,'f'],[.1,rubble,'f'],[.05,()=>chest(false),'w'],[.06,planks,'w'],[.05,candles,'w']);break;
        case 'volcano':P.push([.15,brazier,'w'],[.1,lavaPool,'w'],[.12,stalagmite,'w'],[.06,()=>skeleton(false),'w'],[.08,bonePile,'f'],[.1,rubble,'f'],[.05,()=>chest(false),'w'],[.05,urn,'w']);break;
        case 'cave':P.push([.2,mushrooms,'w'],[.18,stalagmite,'w'],[.1,()=>crystal(M.crystalP),'w'],[.1,bonePile,'f'],[.1,puddle,'f'],[.1,rubble,'f'],[.05,()=>skeleton(false),'w']);break;

      for(const [w,fn,mode] of P){if((q-=w)<0){const p=fn();place(p,mode==='w'?flushSpot(g,x,y,cx,cz):fr);break}}

  });
  instanced(new THREE.DodecahedronGeometry(1,0),th.id==='icecave'?M.iceRock:M.caveRock,bumps,(d,[x,y,z,s],i)=>{d.position.set(x,y,z);d.scale.set(s,s*1.1,s);d.rotation.set(i,i*2,0)});

  instanced(new THREE.DodecahedronGeometry(1,0),stoneMat,stones,(d,[x,z,s,sy],i)=>{d.position.set(x,s*.3,z);d.scale.set(s,s*sy,s);d.rotation.set(i,i*3,0)});
  instanced(new THREE.BoxGeometry(1,1,1),M.rock,chunks,(d,[x,y,z,w,h,dd,ry],i)=>{d.position.set(x,y,z);d.scale.set(w,h,dd);d.rotation.set(R(-.2,.2),ry,R(-.2,.2))});
  if(th.carpet){ // красная дорожка по кратчайшему пути к выходу
    const path=solvePath(g,start,exit,(x,y)=>!skipSet.has(x+','+y)),cp=[];
    path.forEach((c,i)=>{const p=path[Math.max(0,i-1)],n=path[Math.min(path.length-1,i+1)];cp.push([c[0],c[1],(n[0]-p[0])!==0?0:1])});
    instanced(new THREE.BoxGeometry(B,.03,1.3),M.carpetM,cp,(d,[x,y,r])=>{d.position.set(wc(x),.02,wc(y));d.rotation.y=r?Math.PI/2:0});
  }
  if(outdoor)buildOutdoor(size,th);
  mergeStatic();
  {
    const f=th.fx,pos=new Float32Array(f.n*3);
    for(let i=0;i<f.n;i++){pos[i*3]=R(-f.rg,f.rg);pos[i*3+1]=R(0,f.H);pos[i*3+2]=R(-f.rg,f.rg)}
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    parts=new THREE.Points(geo,new THREE.PointsMaterial({color:f.color,size:f.size,fog:false,transparent:f.alpha<1,opacity:f.alpha}));
    parts.userData=f;parts.frustumCulled=false;world.add(parts);
  }
  player.x=wc(start[0]);player.z=wc(start[1]);player.floor=0;player.eyeY=0;player.cool=0;
  player.yaw=g[2][1]===0?-Math.PI/2:Math.PI;player.pitch=0;

}

const unitBox=new THREE.BoxGeometry(1,1,1);
function registerLight(p){
  if(!p.userData.light)return;p.updateMatrixWorld(true);const v=p.userData.light.clone();p.localToWorld(v);v.col=p.userData.col||0xffa860;torches.push(v)}

function decorRoom(r,th,place,H){
  const mid=(r.w-1)/2, cx=wc(r.x0+mid), cz=wc(r.y0+mid), winter=th.id==='winter';
  const gm=maze.g;
  const corners=[[-1,-1],[1,-1],[-1,1],[1,1]].map(([sx,sy])=>{
    const bx=r.x0+(sx>0?r.w-1:0),by=r.y0+(sy>0?r.w-1:0),cxw=wc(bx),czw=wc(by);
    const openX=gm[bx+sx]&&gm[bx+sx][by]===0,openY=gm[bx][by+sy]===0;
    if(openX||openY)return null;                                   // у входа не ставим
    return rnd()<.5?wspot(cxw,czw,sx,0,sy*-.45):wspot(cxw,czw,0,sy,sx*-.45)}).filter(Boolean);
  const at=(x,z,yaw=0)=>({x,z,yaw});
  const alt=(a,b)=>corners.forEach((c,i)=>place(i%2?b():a(),c));
  switch(r.type){
    case 'crypt':place(sarcophagus(),at(cx,cz,rnd()<.5?0:Math.PI/2));corners.forEach((c,i)=>place(i%2?candles():skeleton(true),c));break;
    case 'treasure':{corners.forEach(c=>place(chest(true),c));
      const d=new THREE.Group();d.add(box(1.6,.2,1.6,M.rock,0,.1,0));const ch=chest(true);ch.position.y=.2;ch.scale.set(1.2,1.2,1.2);d.add(ch);d.add(goldPile(0,.2,.7));
      d.userData.light=new THREE.Vector3(0,1.2,0);place(d,at(cx,cz,rnd()*6));break}
    case 'pillars':alt(()=>barrel(),()=>skeleton(false));if(r.big)place(candles(),at(cx,cz));break;
    case 'ossuary':place(skullPyramid(),at(cx,cz,rnd()*6));corners.forEach((c,i)=>place(i%2?bonePile():candles(),c));break;
    case 'burial':place(sarcophagus(),at(cx,cz,rnd()<.5?0:Math.PI/2));corners.forEach(c=>place(brazier(),c));break;
    case 'crystal':{const c=crystal(rnd()<.5?M.crystalI:M.crystalP);c.scale.set(2,2,2);place(c,at(cx,cz));corners.forEach((cc,i)=>{if(i%2)place(stalagmite(),cc)});break}
    case 'frozen':place(iceBlock(true),at(cx,cz,rnd()*6));corners.forEach((c,i)=>{if(i%2)place(icePatch(),c);else place(stalagmite(),c)});break;
    case 'grove':{place(mushrooms(),at(cx,cz));place(mushrooms(),at(cx+1.2,cz+1.2));corners.forEach((c,i)=>{if(i%2)place(mushrooms(),c);else place(stalagmite(),c)});break}
    case 'lair':place(bonePile(),at(cx,cz));corners.forEach((c,i)=>{if(i%2)place(skeleton(i>1),c);else place(stalagmite(),c)});break;
    case 'hall':{place(tableSet(),at(cx,cz,rnd()<.5?0:Math.PI/2));const ch=chandelier(H);ch.position.set(cx,0,cz);world.add(ch);registerLight(ch);
      corners.forEach((c,i)=>place(i%2?candelabra():armor(),c));break}
    case 'throne':{place(throne(),at(cx,cz,rnd()<.5?0:Math.PI));const ch=chandelier(H);ch.position.set(cx,0,cz);world.add(ch);registerLight(ch);
      corners.forEach((c,i)=>place(i%2?statue():armor(),c));break}
    case 'library':{corners.forEach(c=>place(bookshelf(),c));place(desk(),at(cx,cz,rnd()<.5?0:Math.PI/2));break}
    case 'camp':{place(campfire(),at(cx,cz));for(let i=0;i<4;i++){const a=i/4*6.28+.4;const gg=new THREE.Group();gg.add(box(1,.28,.3,M.wood,0,.14,0));place(gg,at(cx+Math.cos(a)*1.5,cz+Math.sin(a)*1.5,-a+1.57))}
      corners.forEach((c,i)=>place(i%2?crate(true):sacks(),c));break}
    case 'ruins':corners.forEach(c=>{const rr=new THREE.Group();rr.add(box(.6,R(.6,1.4),.6,M.snowRock,0,.5,0));rr.add(box(.7,.14,.7,M.snow,0,1.3,0));place(rr,c)});
      place(skeleton(false),at(cx+.9,cz+.5,rnd()*6));if(r.big)place(chest(false),at(cx,cz,rnd()*6));break;
  }
}

function buildExit(th,H){
  const winter=!!th.outdoor;
  const g=new THREE.Group();g.position.copy(exitPos);
  const door=new THREE.Group();door.position.x=B/2-.1;
  if(winter){
    door.add(box(.35,2.3,1.7,M.coal,0,1.15,0));
    for(const z of [-.5,0,.5])door.add(box(.4,2.3,.08,M.metal,0,1.15,z));
    door.add(box(.45,.25,2.1,M.rock,0,2.4,0));
    for(const z of [-1.1,1.1]){door.add(box(.5,2.6,.3,M.rock,0,1.3,z));
      const b=new THREE.Mesh(new THREE.PlaneGeometry(.7,1.5),M.banner);b.position.set(-.2,1.7,z*1.6);b.rotation.y=-Math.PI/2;door.add(b)}
  }else if(th.id==='icecave'||th.id==='cave'){ // светящийся проход
    door.add(box(.5,.3,2.4,M.caveRock,0,2.7,0));door.add(box(.5,2.6,.35,M.caveRock,0,1.3,-1.05));door.add(box(.5,2.6,.35,M.caveRock,0,1.3,1.05));
    door.add(box(.05,2.4,1.5,basic(th.id==='icecave'?0x9fd8ff:0x60ffc0),-.05,1.2,0));
  }else{
    door.add(box(.25,2.4,1.5,M.wood,0,1.2,0));
    for(const y of [.5,1.2,1.9])door.add(box(.3,.12,1.55,M.metal,0,y,0));
    const top=new THREE.Mesh(new THREE.CylinderGeometry(.75,.75,.25,8,1,false,0,Math.PI),M.wood);
    top.rotation.set(Math.PI/2,0,Math.PI/2);top.position.y=2.4;door.add(top);
    door.add(box(.35,.3,.3,M.metal,-.1,1.1,.5));
  }
  g.add(door);
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,H,6,1,true),new THREE.MeshBasicMaterial({color:0xffcc66,transparent:true,opacity:.18,fog:false,side:THREE.DoubleSide}));
  beam.position.set(-.2,H/2,0);beam.userData.keep=true;g.add(beam);
  world.add(g);
  const l=new THREE.PointLight(0xffc060,1.2,10,1.5);l.position.set(exitPos.x,2,exitPos.z);world.add(l);
  if(th.torch){addTorch(exitPos.x+B/2-.15,exitPos.z-.95,1,0,th.torch);addTorch(exitPos.x+B/2-.15,exitPos.z+.95,1,0,th.torch)}
}
function addTorch(x,z,dx,dy,style,y0=0){
  const g=new THREE.Group();g.position.set(x,(style==='lantern'?1.9:1.7)+y0,z);
  const fy=(style==='lantern'?1.8:2.1)+y0;let fx,fz;
  if(style==='lantern'){
    g.add(box(.08,.9,.08,M.wood,-dx*.1,0,-dy*.1));
    g.add(box(Math.abs(dx)?.35:.08,.06,Math.abs(dy)?.35:.08,M.wood,-dx*.2,.4,-dy*.2));
    g.add(box(.27,.36,.27,M.lantern,-dx*.35,.05,-dy*.35));
    g.add(box(.31,.05,.31,M.metal,-dx*.35,.26,-dy*.35));
    fx=x-dx*.35;fz=z-dy*.35;
  }else{
    const px=Math.abs(dx)>.5;
    g.add(box(px?.05:.28,.38,px?.28:.05,M.metal,dx*.13,0,dy*.13));
    g.add(box(px?.3:.06,.06,px?.06:.3,M.metal,-dx*.01,-.12,-dy*.01));
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(.1,.06,.16,6),M.metal);cup.position.set(-dx*.17,-.04,-dy*.17);g.add(cup);
    g.add(box(.05,.1,.05,M.wood,-dx*.17,.08,-dy*.17));
    const f=new THREE.Sprite(M.flame);f.scale.set(.5,.75,1);f.position.set(-dx*.17,.3,-dy*.17);g.add(f);flames.push(f);
    const gl=new THREE.Sprite(M.glowS);gl.scale.set(1.5,1.5,1);gl.position.set(-dx*.17,.3,-dy*.17);g.add(gl);
    fx=x-dx*.17;fz=z-dy*.17;
  }
  world.add(g);const v=new THREE.Vector3(fx,fy,fz);v.col=0xffa860;torches.push(v);
}

function chest(open){const g=new THREE.Group();g.add(box(.9,.45,.55,M.chest,0,.225,0));g.add(box(.1,.12,.6,M.metal,0,.45,0));
  if(open){const lid=box(.9,.2,.55,M.chest,0,0,0);const pv=new THREE.Group();pv.position.set(0,.45,-.27);lid.position.set(0,.1,.27);pv.add(lid);pv.rotation.x=-1.9;g.add(pv);
    g.add(box(.8,.06,.45,M.gold,0,.44,0));g.add(goldPile(0,.45,.2))}
  else g.add(box(.9,.2,.55,M.chest,0,.55,0));g.userData.half=0.32;return g}
function goldPile(x,y,r){const g=new THREE.Group();for(let i=0;i<9;i++){const c=box(.12,.05,.12,M.gold,x+R(-r,r)*.8,y+R(0,.08),R(-r,r)*.8);c.rotation.y=rnd()*3;g.add(c)}return g}
function barrel(){const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.34,.3,.85,8),M.wood);b.position.y=.43;g.add(b);
  for(const y of [.2,.65]){const r=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.06,8),M.metal);r.position.y=y;g.add(r)}g.userData.half=0.36;return g}

function decorStruct(s,th,place){
  const SH=s.H,w=s.w,x0=s.x0,y0=s.y0,out=th.outdoor,mid=(w-1)/2,cx=wc(x0+mid),cz=wc(y0+mid),g=maze.g;
  const at=(x,z,yaw=0,ref=0)=>({x,z,yaw,ref});
  const isRing=(i,j)=>i===0||j===0||i===w-1||j===w-1;
  const normsOf=(i,j)=>{const n=[];if(i===0)n.push([-1,0]);if(i===w-1)n.push([1,0]);if(j===0)n.push([0,-1]);if(j===w-1)n.push([0,1]);return n};
  const gpos=([i,j])=>[wc(x0+i),wc(y0+j)];
  const doorAdj=new Set(s.doors.map(d=>d.i+','+d.j));
  const tall=s.kind==='keep'||s.kind==='tower';
  const winMat=()=>th.id==='castle'?[M.winA,M.winB,M.winC][rnd()*3|0]:(out?M.winG:M.winW);
  // --- парапеты вдоль внутреннего края галереи ---
  const bal=(px,pz,alongX,len)=>world.add(alongX?box(len,.95,.14,M.parapet,px,HF+.475,pz):box(.14,.95,len,M.parapet,px,HF+.475,pz));
  const bridgeRing=new Set();
  if(s.bridge){bridgeRing.add('0,2');bridgeRing.add((w-1)+',2')}
  for(let i=0;i<w;i++)for(let j=0;j<w;j++){if(!isRing(i,j))continue;
    for(const [di,dj] of dirs){const ni=i+di,nj=j+dj;if(ni<0||nj<0||ni>=w||nj>=w||isRing(ni,nj))continue;
      if(i+','+j===s.topRing&&ni+','+nj===s.topIn)continue;
      bal(wc(x0+i)+di*(B/2-.07),wc(y0+j)+dj*(B/2-.07),dj!==0,B)}}
  // --- окна, знамёна, факелы на стенах (оба этажа) ---
  for(let i=0;i<w;i++)for(let j=0;j<w;j++){if(!isRing(i,j))continue;
    for(const [nx,nz] of normsOf(i,j)){
      if(g[x0+i+nx]&&g[x0+i+nx][y0+j+nz]!==1)continue;
      const bx=wc(x0+i),bz=wc(y0+j),lat=nx?j:i;
      if(lat%2===0&&!bridgeRing.has(i+','+j)){
        decal(winMat(),1.15,2.3,bx,bz,nx,nz,HF+1.9,0);                       // верхний этаж
        world.add(box(1.3,.1,.26,M.archStone,bx+nx*(B/2-.12),HF+.68,bz+nz*(B/2-.12)));
        if(!doorAdj.has(i+','+j)){decal(winMat(),1.15,2.3,bx,bz,nx,nz,2.2,0);world.add(box(1.3,.1,.26,M.archStone,bx+nx*(B/2-.12),1.0,bz+nz*(B/2-.12)))}
      }else if(lat%2===1&&rnd()<.5){decal(th.id==='castle'||th.id==='nordic'?M.bannerList[rnd()*3|0]:M.banner,.9,1.8,bx,bz,nx,nz,HF+1.7,0)}
    }
  }
  // --- ряд предметов вдоль стен: нижний и верхний этаж ---
  const rimG=[],rimU=[];
  for(const [i,j] of s.ground){
    if(doorAdj.has(i+','+j))continue;
    const [bx,bz]=gpos([i,j]);const ns=normsOf(i,j);if(!ns.length)continue;const [nx,nz]=ns[rnd()*ns.length|0];
    rimG.push({...wspot(bx,bz,nx,nz,[-.45,0,.45][rnd()*3|0]),ref:0});
  }
  for(let i=0;i<w;i++)for(let j=0;j<w;j++){if(!isRing(i,j))continue;const key=i+','+j;if(key===s.topRing||bridgeRing.has(key))continue;
    const ns=normsOf(i,j);const [nx,nz]=ns[rnd()*ns.length|0];if(g[x0+i+nx]&&g[x0+i+nx][y0+j+nz]!==1)continue;
    rimU.push({...wspot(wc(x0+i),wc(y0+j),nx,nz,[-.45,0,.45][rnd()*3|0]),ref:HF})}
  rimG.sort(()=>rnd()-.5);rimU.sort(()=>rnd()-.5);
  const lists={
    castle:{g:[armor,statue,candelabra,bookshelf,urn,chest],u:[bookshelf,()=>chest(true),armor,candelabra,bed,wardrobe]},
    dungeon:{g:[barrel,()=>skeleton(true),weaponRack,()=>chest(false),candles],u:[()=>chest(false),bookshelf,bed,weaponRack,barrel]},
    catacombs:{g:[()=>skeleton(true),skullPyramid,urn,coffin,candles],u:[urn,coffin,candles,bookshelf,()=>skeleton(true)]},
    nordic:{g:[()=>draugr(true),brazier,urn,()=>chest(false),weaponRack],u:[brazier,bookshelf,()=>chest(true),()=>draugr(true),bed]},
    icecave:{g:[stalagmite,()=>crystal(M.crystalI),()=>iceBlock(true)],u:[()=>crystal(M.crystalP),stalagmite,()=>crystal(M.crystalI)]},
    cave:{g:[mushrooms,stalagmite,()=>crystal(M.crystalP),bonePile],u:[mushrooms,()=>crystal(M.crystalP),stalagmite]},
    winter:{g:[bookshelf,()=>chest(false),barrel,sacks,bench,weaponRack],u:[bed,wardrobe,bookshelf,()=>chest(true),desk]},
    forest:{g:[bookshelf,()=>chest(false),barrel,sacks,bench,weaponRack],u:[bed,wardrobe,bookshelf,()=>chest(true),desk]}};
  const L2=lists[th.id]||(th.outdoor?lists.forest:lists.dungeon);
  const gl=s.kind==='tower'?[weaponRack,barrel,()=>crate(false),armor,bench]:L2.g;
  const ul=s.kind==='tower'?[bed,bookshelf,wardrobe,desk,()=>chest(true)]:L2.u;
  let a=0,b=0;
  for(const sp of rimG)if(rnd()<.6)place(gl[a++%gl.length](),sp);
  for(const sp of rimU)if(rnd()<.6)place(ul[b++%ul.length](),sp);
  // --- факелы наверху ---
  for(let i=0;i<w;i++)for(let j=0;j<w;j++){if(!isRing(i,j)||(rnd()>.35))continue;const ns=normsOf(i,j);const [nx,nz]=ns[0];
    if(g[x0+i+nx]&&g[x0+i+nx][y0+j+nz]!==1)continue;if(bridgeRing.has(i+','+j))continue;
    if(th.torch&&(nx?j:i)%2===1)addTorch(wc(x0+i)+nx*(B/2-.15),wc(y0+j)+nz*(B/2-.15),nx,nz,th.torch,HF+.2)}
  // --- центр нижнего этажа ---
  const cells=s.ground.filter(([i,j])=>i%2===0&&j%2===0&&i>0&&j>0&&i<w-1&&j<w-1);
  const chand=(n,drop,rad)=>{cells.sort(()=>rnd()-.5).slice(0,n).forEach(c=>{const [px,pz]=gpos(c);const ch=chandelier(SH,drop,rad);ch.position.set(px,0,pz);world.add(ch);registerLight(ch)})};
  const dropH=Math.max(1.2,SH-HF-1.3);
  if(s.kind==='tower'){chand(1,SH-(HF+1.4),.9);
    const t=tableSet();place(t,at(cx,cz,rnd()<.5?0:Math.PI/2));return}
  if(th.id==='icecave'){for(let k=0;k<3;k++){const c=crystal(rnd()<.5?M.crystalI:M.crystalP);c.scale.set(2.6,2.6,2.6);place(c,at(cx+R(-1.5,1.5),cz+R(-1.5,1.5)))}return}
  if(th.id==='cave'){for(let k=0;k<3;k++){const c=mushrooms();c.scale.set(2.6,2.6,2.6);place(c,at(cx+R(-1.6,1.6),cz+R(-1.6,1.6)))}return}
  chand(w>7?4:2,dropH,.95);
  switch(s.kind==='keep'?'keep':th.id){
    case 'castle':place(tableSet(),at(cx,cz,rnd()<.5?0:Math.PI/2));{const [fx,fz]=gpos(s.ground.find(([i,j])=>j===w-1&&!doorAdj.has(i+','+j)&&i>1&&i<w-2)||s.ground[0]);place(throne(),at(fx,fz-1.1,0))}break;
    case 'dungeon':place(sarcophagus(),at(cx,cz,rnd()*3));place(chest(true),at(cx+1.7,cz+.6,rnd()*6));place(skeleton(false),at(cx-1.6,cz-.8,rnd()*6));break;
    case 'catacombs':place(skullPyramid(),at(cx,cz,0));place(coffin(),at(cx+1.8,cz,1.57));place(coffin(),at(cx-1.8,cz,1.57));break;
    case 'nordic':place(sarcophagus(),at(cx,cz,rnd()<.5?0:Math.PI/2));place(brazier(),at(cx+1.6,cz+1.6));place(brazier(),at(cx-1.6,cz-1.6));place(draugr(false),at(cx-1.5,cz+1.8,rnd()*6));break;
    case 'keep':{place(tableSet(),at(cx,cz,rnd()<.5?0:Math.PI/2));
      const wallSp=rimG.find(sp=>true);if(wallSp)place(fireplace(),wallSp);
      for(const sp of rimG.slice(1,6))if(rnd()<.35)place(bench(),sp);break}
  }
}

function roofKit(grp,w,d,H0,th,o={}){

  canvas.requestPointerLock();}
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='KeyM')mapEl.style.display=mapEl.style.display==='block'?'none':'block';
  if(e.code==='KeyR'&&document.pointerLockElement===canvas)build()});
addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('pointerlockchange',()=>{
  const locked=document.pointerLockElement===canvas;
  ui.style.display=locked?'none':'flex';
  if(!locked){showScreen('scr-main');$('btnResume').classList.toggle('hidden',!game.started);for(const k in keys)keys[k]=false}});
addEventListener('mousemove',e=>{if(document.pointerLockElement!==canvas)return;
  const k=.0022*S.sens;
  player.yaw-=e.movementX*k;player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch-e.movementY*k*(S.invert?-1:1)))});

// --- меню ---
$('btnResume').onclick=()=>canvas.requestPointerLock();
$('btnPlay').onclick=()=>showScreen('scr-play');
$('btnSet').onclick=()=>showScreen('scr-set');
$('btnStart').onclick=startGame;
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>showScreen('scr-main'));
// карточки карт
const mapsEl=$('maps');
function renderMaps(){
  mapsEl.innerHTML='';
  const items=[...Object.entries(THEMES).map(([id,t])=>({id,name:t.name,desc:t.desc,sw:t.sw})),{id:'random',name:'Случайная',desc:'Новая карта при каждом выходе',sw:['#8a4a30','#40a0ff']}];
  for(const it of items){
    const c=document.createElement('div');c.className='card'+(S.map===it.id?' sel':'');
    c.innerHTML='<i style="background:linear-gradient(90deg,'+it.sw[0]+','+it.sw[1]+')"></i><b>'+it.name+'</b><span>'+it.desc+'</span>';
    c.onclick=()=>{S.map=it.id;saveS();renderMaps()};mapsEl.appendChild(c)}
}
renderMaps();
function bindSlider(id,key,fmt,apply){
  const el=$(id),lab=$(id+'V');el.value=S[key];lab.textContent=fmt(S[key]);
  el.addEventListener('input',()=>{S[key]=+el.value;lab.textContent=fmt(S[key]);saveS();apply&&apply()})}
function bindCheck(id,key,apply){const el=$(id);el.checked=S[key];el.addEventListener('change',()=>{S[key]=el.checked;saveS();apply&&apply()})}
bindSlider('sens','sens',v=>'×'+(+v).toFixed(2));
bindSlider('fov','fov',v=>v+'°',resize);
bindSlider('pix','pix',v=>v+'px',resize);
bindSlider('size','size',v=>v+'×'+v);
bindCheck('showfps','fps',()=>{$('fps').style.display=S.fps?'block':'none'});
bindCheck('bob','bob');bindCheck('invert','invert');
$('cap').value=String(S.cap);$('cap').onchange=()=>{S.cap=+$('cap').value;nextT=0;saveS()};
$('fps').style.display=S.fps?'block':'none';

const RAD=.38;
function solidL(x,z,ref){const bx=Math.floor(x/B),bz=Math.floor(z/B),g=maze.g;if(!g[bx]||g[bx][bz]===undefined)return true;
  const up=maze.hmapU[bx*maze.W+bz];if(up>0&&Math.abs(up-ref)<.9)return false;return g[bx][bz]!==0}
function blockedL(x,z,ref){return solidL(x-RAD,z-RAD,ref)||solidL(x+RAD,z-RAD,ref)||solidL(x-RAD,z+RAD,ref)||solidL(x+RAD,z+RAD,ref)}
function canGo(nx,nz){const ref=player.floor;return !blockedL(nx,nz,ref)&&Math.abs(floorAt(nx,nz,ref)-ref)<=.65}
function move(dx,dz){if(canGo(player.x+dx,player.z))player.x+=dx;if(canGo(player.x,player.z+dz))player.z+=dz;player.floor=floorAt(player.x,player.z,player.floor)}

const mapC=mapEl,mg=mapC.getContext('2d');
function updateMap(){const W=maze.W;mapC.width=W;mapC.height=W;mapC.style.width=mapC.style.height=Math.min(220,Math.max(W*4,120))+'px'}
function drawMap(){const W=maze.W;mg.clearRect(0,0,W,W);
  for(let x=0;x<W;x++)for(let y=0;y<W;y++){mg.fillStyle=maze.g[x][y]?'#5a3a2c':(maze.hmap[x*W+y]>0?'#3a4a6a':(maze.cmap[x*W+y]>0?'#2a2230':'#1a1210'));mg.fillRect(x,y,1,1)}
  mg.fillStyle='#a070ff';for(const p of maze.portals)mg.fillRect(p.x/B-.5,p.z/B-.5,1,1);
  mg.fillStyle='#ffcc66';mg.fillRect(exitPos.x/B|0,exitPos.z/B|0,1,1);
  mg.fillStyle='#4af';mg.fillRect(player.x/B-.5,player.z/B-.5,1,1)}

const clock=new THREE.Clock();let t=0,fN=0,fT=0,nextT=0,rafLast=0,rafDt=[],msAcc=0,hzTxt='';
function frame(now){
  requestAnimationFrame(frame);
  if(rafLast){rafDt.push(now-rafLast);if(rafDt.length>40)rafDt.shift()}rafLast=now;
  const tStart=performance.now();
  if(S.cap>0){const iv=1000/S.cap;if(now<nextT-2)return;nextT+=iv;if(nextT<now-iv)nextT=now}
  const rawDt=clock.getDelta(),dt=Math.min(rawDt,.05);t+=dt;
  fN++;fT+=rawDt;
  if(fT>=.5){
    const srt=[...rafDt].sort((a,b)=>a-b),med=srt.length?srt[srt.length>>1]:16.7,hz=Math.round(1000/med);
    hzTxt=hz+' Гц';
    $('fps').textContent=Math.round(fN/fT)+' FPS'+(S.cap?' (лимит '+S.cap+')':'')+' · монитор/браузер ~'+hz+' Гц · кадр '+(msAcc/fN).toFixed(1)+' мс';
    $('hzInfo').textContent='Частота обновления браузера: ~'+hz+' Гц'+(hz<=35?' — браузер/система ограничивает до 30 (проверь режим энергосбережения, Low Power Mode, частоту монитора)':'');
    fN=0;fT=0;msAcc=0}
  if(document.pointerLockElement===canvas){
    const inW=maze.water&&maze.water.has(Math.floor(player.x/B)+','+Math.floor(player.z/B)),sp=(keys.ShiftLeft?5.5:3.2)*dt*(inW&&!curTh.snowy?.62:1);
    let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
    let s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
    if(f||s){const l=Math.hypot(f,s);f/=l;s/=l;
      const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
      move((-sy*f+cy*s)*sp,(-cy*f-sy*s)*sp);player.bob+=dt*(keys.ShiftLeft?11:8)}
  }
  camera.position.set(player.x,player.eyeY+player.eye+(S.bob?Math.sin(player.bob)*.04:0),player.z);
  camera.rotation.set(player.pitch,player.yaw,0);
  player.eyeY+=(player.floor-player.eyeY)*Math.min(1,dt*14);
  T.water.offset.set(t*.05,t*.03);
  if(player.cool>0)player.cool-=dt;
  const th=curTh;
  const j=.85+Math.sin(t*17)*.08+Math.sin(t*31)*.07;
  hand.intensity=th.hand[1]*j;
  const cam=camera.position;
  const near=torches.map(p=>[p,p.distanceToSquared(cam)]).sort((a,b)=>a[1]-b[1]).slice(0,pool.length);
  pool.forEach((l,i)=>{if(near[i]){l.position.copy(near[i][0]);l.color.setHex(near[i][0].col||0xffa860);l.intensity=(1.3+Math.sin(t*13+i*2)*.25)}else l.intensity=0});
  for(const f of flames){const s=1+Math.sin(t*20+f.id)*.08;f.scale.y=(f.scale.x*1.5)*s}
  if(parts){const u=parts.userData,p=parts.geometry.attributes.position;parts.position.set(player.x,0,player.z);
    for(let i=0;i<p.count;i++){let y=p.getY(i)-dt*u.fall;if(y<0)y+=u.H;if(y>u.H)y-=u.H;p.setY(i,y);p.setX(i,p.getX(i)+Math.sin(t+i)*dt*u.sway)}p.needsUpdate=true}
  if(skyMesh&&skyMesh.visible){skyMesh.position.set(player.x,0,player.z);{const bp=moonSprite.userData.bpos;moonSprite.position.set(player.x+bp[0],bp[1],player.z+bp[2])}}
  if(game.started&&Math.hypot(player.x-exitPos.x,player.z-exitPos.z)<1.3){
    level++;game.theme=pickTheme();build();toast('Выход найден! Уровень '+(level+1))}
  if(mapEl.style.display==='block')drawMap();
  renderer.render(scene,camera);
  msAcc+=performance.now()-tStart;
}
for(const k in THEMES)THEMES[k].id=k;
game.theme=THEMES[S.map]?S.map:'dungeon';
build();requestAnimationFrame(frame);
</script></body></html>
